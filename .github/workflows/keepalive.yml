name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after ~7 days of inactivity, which
# takes the whole app down (you can't create tables, add people, etc.).
# This workflow makes one tiny read request to the database every day, which
# counts as activity and keeps the project from pausing.
#
# Credentials: the URL and anon key below are the SAME public values already
# shipped in the deployed frontend bundle and guarded by RLS, so they are safe
# to commit. If you ever rotate them, add repo secrets SUPABASE_URL and
# SUPABASE_ANON_KEY and they will override the defaults below automatically.

on:
  schedule:
    # 07:00 UTC daily. GitHub may delay scheduled runs under load, but a daily
    # cadence leaves a wide margin against the ~7-day pause window.
    - cron: '0 7 * * *'
  # Lets you trigger a run by hand from the Actions tab (handy to test).
  workflow_dispatch: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://gwxvjingvsssylqtmewn.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3eHZqaW5ndnNzc3lscXRtZXduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MTQ4NjMsImV4cCI6MjA5MDE5MDg2M30.gqJJmt8OK3ZMy9R1ed39ylf-YFebeGddxngxAp_40TU' }}
        run: |
          set -euo pipefail
          echo "Pinging Supabase to keep the project active..."
          code=$(curl -sS -m 30 -o /tmp/resp.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/tables?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $code"
          echo "Response body: $(cat /tmp/resp.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive ping failed (expected HTTP 200, got $code)."
            echo "The project may be paused, or the URL/key may be wrong."
            exit 1
          fi
          echo "Keep-alive ping succeeded — project is active."
